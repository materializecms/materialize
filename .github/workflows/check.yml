# Lint, types, tests and build on every change; known vulnerabilities in the dependencies every
# week too, since new advisories appear without any change here.
name: Controlli

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # Compiles and packs exactly what would be published, with its own TypeScript run.
      - run: npm run release
      # A new site made from these packages must install, build and start.
      - run: npm run smoke
      - run: npm run audit
