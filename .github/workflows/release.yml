# A tag like v0.2.0 publishes that version: the same checks as every change, then the packages
# on npm with provenance (npm shows they were built here, from this commit), then a GitHub release
# with the notes from CHANGELOG.md, then the Docker image on GitHub's registry (ghcr.io), built
# from the packages just published. Needs the NPM_TOKEN secret: an npm granular token that can
# publish (read and write, all packages, bypassing two-factor authentication), at most 90 days.
name: Rilascio

on:
  push:
    tags: ["v*"]
  # Resumes a release that stopped halfway, with the fixed scripts on main: what is already on npm is skipped.
  workflow_dispatch:
    inputs:
      tag:
        description: Il tag della versione da riprendere, per esempio v0.1.0
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - run: npm run release
      # A new site made from these packages must install, build and start.
      - run: npm run smoke
      - run: node scripts/publish.ts --tag "$TAG" --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Release su GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          node scripts/notes.ts "$TAG" > notes.md
          gh release create "$TAG" --verify-tag --title "Materialize ${TAG#v}" --notes-file notes.md packages/cli/install.sh docker/compose.yaml

  docker:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Versione e nome dell'immagine
        id: meta
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/materialize" >> "$GITHUB_OUTPUT"
      # The image installs the packages from npm: wait until the new version is there.
      - name: Attesa dei pacchetti su npm
        run: |
          for i in $(seq 1 30); do
            npm view "create-materialize@${{ steps.meta.outputs.version }}" version && exit 0
            sleep 10
          done
          exit 1
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - name: Prova dell'immagine
        run: |
          docker buildx build --load --build-arg VERSION=${{ steps.meta.outputs.version }} -t materialize:prova docker
          docker run -d --name prova -p 4321:4321 materialize:prova
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4321/)" = 200 ] && exit 0
            sleep 3
          done
          docker logs prova
          exit 1
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          # Links the image to this repository on GitHub.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
